<script>
function showToast(msg){
  let el = document.getElementById('toast-banner');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast-banner';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ el.style.display = 'none'; }, 3000);
}
function closeModal(){
  const ov = document.getElementById('modal-overlay');
  if(ov) ov.remove();
}
function showModal(innerHTML){
  closeModal();
  const ov = document.createElement('div');
  ov.id = 'modal-overlay';
  ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal-box"><button class="modal-close" id="modal-close-btn">×</button>${innerHTML}</div>`;
  ov.onclick = (e)=>{ if(e.target===ov) closeModal(); };
  document.body.appendChild(ov);
  document.getElementById('modal-close-btn').onclick = closeModal;
  return ov;
}
function showConfirmModal(msg, onYes){
  const yesLabel = data.lang==='hi' ? 'हाँ, मिटाओ' : 'Yes, delete';
  const noLabel = data.lang==='hi' ? 'रद्द करें' : 'Cancel';
  const ov = showModal(`
    <div style="font-size:14px;padding:6px 0 4px;">${msg}</div>
    <div class="modal-actions">
      <button class="btn secondary" id="confirm-no">${noLabel}</button>
      <button class="btn danger" id="confirm-yes">${yesLabel}</button>
    </div>
  `);
  document.getElementById('confirm-no').onclick = closeModal;
  document.getElementById('confirm-yes').onclick = ()=>{ closeModal(); onYes(); };
}
function showPromptModal(labelText, onSubmit){
  const okLabel = data.lang==='hi' ? 'ठीक है' : 'OK';
  const cancelLabel = data.lang==='hi' ? 'रद्द करें' : 'Cancel';
  showModal(`
    <div class="field" style="margin-top:8px;"><label>${labelText}</label><input type="number" id="prompt-input" min="1" step="1" autofocus></div>
    <div class="modal-actions">
      <button class="btn secondary" id="prompt-cancel">${cancelLabel}</button>
      <button class="btn" id="prompt-ok">${okLabel}</button>
    </div>
  `);
  document.getElementById('prompt-cancel').onclick = closeModal;
  document.getElementById('prompt-ok').onclick = ()=>{
    const v = Number(document.getElementById('prompt-input').value);
    closeModal();
    if(v && v>0) onSubmit(v);
  };
}

/* ---------------- STATE & STORAGE ---------------- */
const DEFAULT_DATA = {
  products: [], sales: [], customers: [], payments: [], expenses: [], purchases: [], dues: [],
  targets: { daily: 0, monthly: 0, yearly: 0, twoYear: 0, workingDays: 26 }, lang: 'hi'
};
let data = JSON.parse(JSON.stringify(DEFAULT_DATA));
let activeTab = 'dashboard';
let loaded = false;
let storageMode = 'cloud';
let dueRows = [{productId:'',qty:''}];
let historyGroupBy = 'day';
let historyFrom = '';
let historyTo = '';

async function storageGet(key){
  try{ const res = await window.storage.get(key); return res ? res.value : null; }
  catch(e){ try{ return localStorage.getItem(key); }catch(e2){ return null; } }
}
async function storageSet(key, value){
  try{ await window.storage.set(key, value); return 'cloud'; }
  catch(e){ try{ localStorage.setItem(key, value); return 'local'; } catch(e2){ return 'none'; } }
}

async function loadData(){
  try{
    const v = await storageGet('app-data');
    if(v){ data = Object.assign({}, DEFAULT_DATA, JSON.parse(v)); }
  }catch(e){ /* first run */ }
  loaded = true;
  render();
}

let saveTimer = null;
function saveData(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    storageMode = await storageSet('app-data', JSON.stringify(data));
    if(storageMode==='none') render();
  }, 250);
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function numVal(id){ return Number(val(id))||0; }

/* ---------------- DATE HELPERS ---------------- */
function isToday(dateStr){ const d=new Date(dateStr), n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }
function isThisMonth(dateStr){ const d=new Date(dateStr), n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth(); }
function isThisYear(dateStr){ const d=new Date(dateStr), n=new Date(); return d.getFullYear()===n.getFullYear(); }
function daysInCurrentMonth(){ const n=new Date(); return new Date(n.getFullYear(), n.getMonth()+1, 0).getDate(); }
function daysLeftInMonth(){ const n=new Date(); return Math.max(daysInCurrentMonth()-n.getDate()+1,1); }
function daysLeftInYear(){
  const n=new Date(); const start=new Date(n.getFullYear(),0,1);
  const diff=Math.floor((n-start)/86400000);
  const isLeap=(n.getFullYear()%4===0&&n.getFullYear()%100!==0)||n.getFullYear()%400===0;
  return Math.max((isLeap?366:365)-diff,1);
}

/* ---------------- CALCULATIONS ---------------- */
function saleProfit(s){ return (s.sellingPrice - s.costPrice) * s.qty - (s.discount||0); }
function saleRevenue(s){ return s.sellingPrice * s.qty - (s.discount||0); }
function filteredSales(pred){ return data.sales.filter(s=>pred(s.date)); }
function sumRevenue(sales){ return sales.reduce((a,s)=>a+saleRevenue(s),0); }
function sumProfit(sales){ return sales.reduce((a,s)=>a+saleProfit(s),0); }
function periodExpenses(pred){ return data.expenses.filter(e=>pred(e.date)).reduce((a,e)=>a+Number(e.amount),0); }
function netProfitForPeriod(pred){ return sumProfit(filteredSales(pred)) - periodExpenses(pred); }
function workingDaysLeftInMonth(){
  const wd = Math.max(Number(data.targets.workingDays)||26, 1);
  const frac = daysLeftInMonth() / daysInCurrentMonth();
  return Math.max(Math.round(wd * frac), 1);
}
function workingDaysElapsedInMonth(){
  const wd = Math.max(Number(data.targets.workingDays)||26, 1);
  const n = new Date();
  const frac = n.getDate() / daysInCurrentMonth();
  return Math.max(Math.round(wd * frac), 1);
}
function soldQtyForProduct(productId, pred){ return data.sales.filter(s=>s.productId===productId && pred(s.date)).reduce((a,s)=>a+Number(s.qty),0); }

function mondayOf(d){
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day===0 ? -6 : 1-day);
  dt.setDate(dt.getDate()+diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function groupSalesBy(by){
  const map = {};
  data.sales.forEach(s=>{
    const d = new Date(s.date);
    let key, label;
    if(by==='day'){ key = d.toISOString().slice(0,10); label = fmtDate(s.date); }
    else if(by==='week'){ const mon = mondayOf(d); key = mon.toISOString().slice(0,10); label = fmtDate(mon)+' →'; }
    else if(by==='month'){ key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); label = d.toLocaleDateString('en-IN',{month:'short',year:'numeric'}); }
    else { key = String(d.getFullYear()); label = key; }
    if(!map[key]) map[key] = {key, label, revenue:0, profit:0};
    map[key].revenue += saleRevenue(s);
    map[key].profit += saleProfit(s);
  });
  return Object.values(map).sort((a,b)=> b.key.localeCompare(a.key));
}

function kingProducts(sales, by){
  const map = {};
  sales.forEach(s=>{
    if(!map[s.productId]) map[s.productId] = {name:s.productName, qty:0, revenue:0, profit:0};
    map[s.productId].qty += Number(s.qty);
    map[s.productId].revenue += saleRevenue(s);
    map[s.productId].profit += saleProfit(s);
  });
  const arr = Object.values(map);
  arr.sort((a,b)=> by==='qty' ? b.qty-a.qty : b.profit-a.profit);
  return arr;
}

function recalcCustomerDue(customerId){
  const cust = data.customers.find(c=>c.id===customerId);
  if(!cust) return;
  const creditSales = data.sales.filter(s=>s.customerId===customerId && s.paymentMode==='credit').reduce((a,s)=>a+saleRevenue(s),0);
  const manualDues = data.dues.filter(d=>d.customerId===customerId).reduce((a,d)=>a+Number(d.amount),0);
  const paid = data.payments.filter(p=>p.customerId===customerId).reduce((a,p)=>a+Number(p.amount),0);
  cust.totalDue = Math.max(creditSales + manualDues - paid, 0);
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportCSV(sales, filename){
  const rows = [['Date','Product','Qty','Selling Price','Cost Price','Discount','Revenue','Profit','Payment Mode','Customer']];
  sales.forEach(s=>{ rows.push([fmtDate(s.date), s.productName, s.qty, s.sellingPrice, s.costPrice, s.discount||0, saleRevenue(s).toFixed(2), saleProfit(s).toFixed(2), s.paymentMode, s.customerName]); });
  rows.push([]);
  rows.push(['Total','','','','','', sumRevenue(sales).toFixed(2), sumProfit(sales).toFixed(2)]);
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadBlob(csv, filename, 'text/csv');
}
function exportPDF(sales, title, filename){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 15;
  doc.setFontSize(14); doc.text(title, 14, y); y += 8;
  doc.setFontSize(9);
  doc.text('Date', 14, y); doc.text('Product', 40, y); doc.text('Qty', 100, y);
  doc.text('Revenue', 120, y); doc.text('Profit', 155, y); doc.text('Mode', 180, y);
  y += 5; doc.line(14, y, 196, y); y += 5;
  sales.forEach(s=>{
    if(y > 280){ doc.addPage(); y = 15; }
    doc.text(fmtDate(s.date), 14, y);
    doc.text(String(s.productName).slice(0,28), 40, y);
    doc.text(String(s.qty), 100, y);
    doc.text(saleRevenue(s).toFixed(0), 120, y);
    doc.text(saleProfit(s).toFixed(0), 155, y);
    doc.text(s.paymentMode, 180, y);
    y += 6;
  });
  y += 4; doc.line(14, y, 196, y); y += 7;
  doc.setFontSize(10);
  doc.text('Total Revenue: '+fmt(sumRevenue(sales)), 14, y); y += 6;
  doc.text('Total Profit: '+fmt(sumProfit(sales)), 14, y);
  doc.save(filename);
}

function targetCard(label, achieved, target, extraNote){
  const pct = target>0 ? (achieved/target*100) : 0;
  const remaining = Math.max(target - achieved, 0);
  return `
    <div class="card">
      <h3>${label}</h3>
      <div class="progress-line">
        <div class="top"><span>${fmt(achieved)} / ${fmt(target)}</span><span>${pct.toFixed(1)}%</span></div>
        <div class="progress-track"><div class="progress-fill ${pct>=100?'over':''}" style="width:${Math.min(pct,100)}%"></div></div>
      </div>
      ${target>0 ? `<div class="empty-note" style="padding:0;">${t('remaining')}: ${fmt(remaining)}</div>` : `<div class="empty-note" style="padding:0;">${t('setTargets')} → ${t('targets')}</div>`}
      ${extraNote||''}
    </div>
  `;
}

function renderDashboard(ctx){
  const todayNet = netProfitForPeriod(isToday);
  const monthNet = netProfitForPeriod(isThisMonth);
  const yearNet = netProfitForPeriod(isThisYear);
  const monthGross = sumProfit(ctx.monthSales);

  const monthPending = Math.max(data.targets.monthly - monthNet, 0);
  const wdLeft = workingDaysLeftInMonth();
  const wdElapsed = workingDaysElapsedInMonth();
  const reqDaily = monthPending>0 ? monthPending/wdLeft : 0;
  const buffer = monthNet - data.targets.monthly;
  const todayVsDaily = todayNet - Number(data.targets.daily||0);

  const avgDailySoFar = monthNet / wdElapsed;
  const projected = avgDailySoFar * Math.max(Number(data.targets.workingDays)||26,1);
  let status = t('statusOnTrack');
  if(data.targets.monthly>0){
    if(projected >= data.targets.monthly*1.03) status = t('statusAhead');
    else if(projected <= data.targets.monthly*0.97) status = t('statusBehind');
  }

  const kingTodayQty = kingProducts(ctx.todaySales,'qty')[0];
  const kingMonthQty = kingProducts(ctx.monthSales,'qty')[0];

  return `
    <h2 class="section-title">${t('dashboard')}</h2>
    <div class="empty-note" style="padding:0 0 14px;">${t('netProfitBasis')}</div>
    <div class="grid-2">
      <div>
        <div class="card">
          <h3>${t('today')}</h3>
          <table>
            <tbody>
              <tr><td>${t('todaySale')}</td><td class="num tabular">${fmt(ctx.todayRevenue)}</td></tr>
              <tr><td>${t('grossProfit')}</td><td class="num tabular">${fmt(sumProfit(ctx.todaySales))}</td></tr>
              <tr><td>${t('todayNetProfit')}</td><td class="num tabular ${todayNet>=0?'':''}" style="color:${todayNet>=0?'var(--gold)':'var(--red)'}">${fmt(todayNet)}</td></tr>
              <tr><td>${t('todayTarget')}</td><td class="num tabular">${fmt(data.targets.daily)}</td></tr>
            </tbody>
          </table>
          ${data.targets.daily>0 ? (todayVsDaily>=0
            ? `<div class="badge gold">${t('surplusToday')}: ${fmt(todayVsDaily)}</div>`
            : `<div class="badge red">${t('shortfallToday')}: ${fmt(-todayVsDaily)}</div>`) : ''}
          <div style="margin-top:8px;"><span class="badge ${status===t('statusBehind')?'red':'gold'}">${t('status')}: ${status}</span></div>
        </div>
        ${targetCard(t('monthlyTarget'), monthNet, data.targets.monthly,
          data.targets.monthly>0 ? (buffer>=0
            ? `<div class="badge gold" style="margin-top:8px;">${t('bufferMade')}: ${fmt(buffer)}</div>`
            : `<div class="badge red" style="margin-top:8px;">${t('requiredAvg')}: ${fmt(reqDaily)}</div>`) : '')}
        ${targetCard(t('yearlyTarget'), yearNet, data.targets.yearly)}
        ${data.targets.twoYear>0 ? targetCard(t('twoYearTarget'), netProfitForPeriod(()=>true), data.targets.twoYear) : ''}
      </div>
      <div>
        <div class="card">
          <h3>${t('kingToday')}</h3>
          ${kingTodayQty ? `<div style="font-size:16px;font-weight:700;">${kingTodayQty.name}</div><div class="empty-note" style="padding:4px 0 0;">${kingTodayQty.qty} ${t('qty')} · ${fmt(kingTodayQty.profit)} ${t('profitTotal')}</div>` : `<div class="empty-note">${t('noData')}</div>`}
        </div>

          ${kingMonthQty ? `<div style="font-size:16px;font-weight:700;">${kingMonthQty.name}</div><div class="empty-note" style="padding:4px 0 0;">${kingMonthQty.qty} ${t('qty')} · ${fmt(kingMonthQty.profit)} ${t('profitTotal')}</div>` : `<div class="empty-note">${t('noData')}</div>`}

function customerLedgerHTML(customerId){
  const cust = data.customers.find(c=>c.id===customerId);
  if(!cust) return `<div class="empty-note">${t('noData')}</div>`;
  const creditSales = data.sales.filter(s=>s.customerId===customerId && s.paymentMode==='credit');
  const dues = data.dues.filter(d=>d.customerId===customerId);
  const payments = data.payments.filter(p=>p.customerId===customerId);
  const rows = [];
  creditSales.forEach(s=> rows.push({date:s.date, desc:s.productName+' × '+s.qty, amount:saleRevenue(s), type:'due'}));
  dues.forEach(d=> rows.push({date:d.date, desc:(d.items&&d.items.length)?d.items.map(it=>it.productName+' × '+it.qty).join(', '):t('manualDue'), amount:d.amount, type:'due'}));
  payments.forEach(p=> rows.push({date:p.date, desc:t('paid'), amount:p.amount, type:'payment'}));
  rows.sort((a,b)=> new Date(a.date)-new Date(b.date));
  let running = 0;
  const rowsHtml = rows.map(r=>{
    running += (r.type==='due' ? r.amount : -r.amount);
    return `<tr><td>${fmtDate(r.date)}</td><td style="font-size:12.5px;">${r.desc}</td><td class="num tabular" style="color:${r.type==='due'?'var(--red)':'var(--gold)'}">${r.type==='due'?'+':'−'}${fmt(r.amount)}</td><td class="num tabular">${fmt(Math.max(running,0))}</td></tr>`;
  }).join('') || `<tr><td colspan="4" class="empty-note">${t('ledgerEmpty')}</td></tr>`;
  return `
    <h3 style="margin:0 0 4px;">${cust.name}</h3>
    <div class="empty-note" style="padding:0 0 10px;">${cust.phone||''}</div>
    <div class="btn-row" style="margin-bottom:14px;">
      ${cust.phone ? `<a href="tel:${cust.phone}" class="btn secondary" style="text-decoration:none;display:inline-flex;align-items:center;">${t('callNow')}</a>` : ''}
      <button type="button" class="btn" id="ledger-pdf-btn">${t('downloadPdf')}</button>
    </div>
    <table>
      <thead><tr><th>${t('date')}</th><th>${t('items')}</th><th class="num">${t('amount')}</th><th class="num">${t('totalDue')}</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div style="margin-top:14px;padding-top:10px;border-top:1.5px solid var(--ink);font-size:15px;font-weight:700;display:flex;justify-content:space-between;">
      <span>${t('ledgerBalance')}</span><span class="tabular" style="color:${cust.totalDue>0?'var(--red)':'var(--gold)'}">${fmt(cust.totalDue)}</span>
    </div>
  `;
}

function exportCustomerLedgerPDF(customerId){
  const cust = data.customers.find(c=>c.id===customerId);
  if(!cust) return;
  const creditSales = data.sales.filter(s=>s.customerId===customerId && s.paymentMode==='credit');
  const dues = data.dues.filter(d=>d.customerId===customerId);
  const payments = data.payments.filter(p=>p.customerId===customerId);
  const rows = [];
  creditSales.forEach(s=> rows.push({date:s.date, desc:s.productName+' x '+s.qty, amount:saleRevenue(s), type:'due'}));
  dues.forEach(d=> rows.push({date:d.date, desc:(d.items&&d.items.length)?d.items.map(it=>it.productName+' x '+it.qty).join(', '):'Old due', amount:d.amount, type:'due'}));
  payments.forEach(p=> rows.push({date:p.date, desc:'Paid', amount:p.amount, type:'payment'}));
  rows.sort((a,b)=> new Date(a.date)-new Date(b.date));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 15;
  doc.setFontSize(14); doc.text(cust.name+' - Account Statement', 14, y); y += 7;
  doc.setFontSize(10);
  if(cust.phone){ doc.text('Phone: '+cust.phone, 14, y); y += 6; }
  doc.text('Date: '+new Date().toLocaleDateString('en-IN'), 14, y); y += 8;
  doc.setFontSize(9);
  doc.text('Date', 14, y); doc.text('Details', 40, y); doc.text('Amount', 145, y); doc.text('Balance', 175, y);
  y += 5; doc.line(14, y, 196, y); y += 5;
  let running = 0;
  rows.forEach(r=>{
    if(y > 280){ doc.addPage(); y = 15; }
    running += (r.type==='due' ? r.amount : -r.amount);
    doc.text(fmtDate(r.date), 14, y);
    doc.text(String(r.desc).slice(0,50), 40, y);
    doc.text((r.type==='due'?'+':'-')+Math.round(r.amount), 145, y);
    doc.text(String(Math.round(Math.max(running,0))), 175, y);
    y += 6;
  });
  y += 4; doc.line(14, y, 196, y); y += 8;
  doc.setFontSize(11);
  doc.text('Current Balance: '+fmt(cust.totalDue), 14, y);
  doc.save((cust.name||'customer').replace(/\s+/g,'_')+'_statement.pdf');
}

/* ---------------- EVENT WIRING PER TAB ---------------- */
function markError(id){ const el=document.getElementById(id); if(el) el.classList.add('field-error'); }
function clearErrors(ids){ ids.forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.remove('field-error'); }); }

function wireTabEvents(tab){
  if(tab==='addSale'){
    const btn = document.getElementById('sale-submit');
    if(btn) btn.onclick = ()=>{
      const ids = ['sale-product','sale-qty'];
      clearErrors(ids);
      const productId = val('sale-product');
      const qty = numVal('sale-qty');
      let bad = false;
      if(!productId){ markError('sale-product'); bad = true; }
      if(!qty || qty<1){ markError('sale-qty'); bad = true; }
      if(bad){ showToast(t('fillRequired')); return; }
      const product = data.products.find(p=>p.id===productId);
      if(!product) return;
      const customerId = val('sale-customer') || null;
      const customer = customerId ? data.customers.find(c=>c.id===customerId) : null;
      const sale = {
        id: uid(), productId, productName: product.name, qty,
        sellingPrice: Number(product.sellingPrice), costPrice: Number(product.costPrice),
        discount: numVal('sale-discount'), paymentMode: val('sale-paymentMode'),
        customerId: customerId, customerName: customer ? customer.name : t('walkIn'),
        date: new Date().toISOString(), notes: val('sale-notes')
      };
      data.sales.push(sale);
      product.stockQty = Math.max(Number(product.stockQty) - qty, 0);
      if(customerId) recalcCustomerDue(customerId);
      saveData(); render();
    };
  }
  if(tab==='products'){
    const btn = document.getElementById('product-submit');
    if(btn) btn.onclick = ()=>{
      const ids = ['prod-name','prod-cost','prod-sell'];
      clearErrors(ids);
      const name = val('prod-name').trim();
      const cost = numVal('prod-cost');
      const sell = numVal('prod-sell');
      let bad = false;
      if(!name){ markError('prod-name'); bad = true; }
      if(cost<=0){ markError('prod-cost'); bad = true; }
      if(sell<=0){ markError('prod-sell'); bad = true; }
      if(bad){ showToast(t('fillRequired')); return; }
      data.products.push({
        id: uid(), name, category: val('prod-category'),
        costPrice: cost, sellingPrice: sell,
        stockQty: numVal('prod-stock'), lowAlert: numVal('prod-lowalert')
      });
      saveData(); render();
    };
    document.querySelectorAll('[data-restock]').forEach(b=>{
      b.onclick = ()=>{
        showPromptModal(t('addStock')+' — '+t('qty'), (n)=>{
          const p = data.products.find(p=>p.id===b.dataset.restock);
          p.stockQty = Number(p.stockQty) + n;
          data.purchases.push({id:uid(), productId:p.id, quantity:n, date:new Date().toISOString()});
          saveData(); render();
        });
      };
    });
    document.querySelectorAll('[data-delprod]').forEach(b=>{
      b.onclick = ()=>{ data.products = data.products.filter(p=>p.id!==b.dataset.delprod); saveData(); render(); };
    });
  }
  if(tab==='customers'){
    document.querySelectorAll('[data-viewledger]').forEach(b=>{
      b.onclick = ()=>{
        showModal(customerLedgerHTML(b.dataset.viewledger));
        const pdfBtn = document.getElementById('ledger-pdf-btn');
        if(pdfBtn) pdfBtn.onclick = ()=> exportCustomerLedgerPDF(b.dataset.viewledger);
      };
    });
    const cbtn = document.getElementById('customer-submit');
    if(cbtn) cbtn.onclick = ()=>{
      clearErrors(['cust-name']);
      const name = val('cust-name').trim();
      if(!name){ markError('cust-name'); showToast(t('fillRequired')); return; }
      data.customers.push({id:uid(), name, phone:val('cust-phone'), totalDue:0});
      saveData(); render();
    };
    function renderDueRows(){
      const box = document.getElementById('due-rows');
      if(!box) return;
      box.innerHTML = dueRows.map((r,i)=>`
        <div class="row2" style="margin-bottom:6px;align-items:center;" data-rowidx="${i}">
          <select class="due-row-product" data-idx="${i}">
            <option value="">${t('selectProduct')}</option>
            ${data.products.map(p=>`<option value="${p.id}" ${r.productId===p.id?'selected':''}>${p.name}</option>`).join('')}
          </select>
          <div style="display:flex;gap:6px;">
            <input type="number" class="due-row-qty" data-idx="${i}" min="1" step="1" placeholder="${t('qty')}" value="${r.qty||''}" style="flex:1;">
            ${dueRows.length>1 ? `<button type="button" class="small-link" data-rmrow="${i}">✕</button>` : ''}
          </div>
        </div>
      `).join('');
      box.querySelectorAll('.due-row-product').forEach(sel=>{
        sel.onchange = ()=>{ dueRows[Number(sel.dataset.idx)].productId = sel.value; updateDueAmountFromRows(); };
      });
      box.querySelectorAll('.due-row-qty').forEach(inp=>{
        inp.oninput = ()=>{ dueRows[Number(inp.dataset.idx)].qty = Number(inp.value)||0; updateDueAmountFromRows(); };
      });
      box.querySelectorAll('[data-rmrow]').forEach(b=>{
        b.onclick = ()=>{ dueRows.splice(Number(b.dataset.rmrow),1); renderDueRows(); updateDueAmountFromRows(); };
      });
    }
    function updateDueAmountFromRows(){
      let total = 0;
      dueRows.forEach(r=>{
        if(r.productId && r.qty>0){
          const p = data.products.find(p=>p.id===r.productId);
          if(p) total += Number(p.sellingPrice)*r.qty;
        }
      });
      if(total>0){ const amtEl=document.getElementById('due-amount'); if(amtEl) amtEl.value = total; }
    }
    renderDueRows();
    const rowAddBtn = document.getElementById('due-row-add');
    if(rowAddBtn) rowAddBtn.onclick = ()=>{ dueRows.push({productId:'',qty:''}); renderDueRows(); };
    const dbtn = document.getElementById('due-submit');
    if(dbtn) dbtn.onclick = ()=>{
      clearErrors(['due-customer','due-amount']);
      const customerId = val('due-customer');
      const amount = numVal('due-amount');
      let bad = false;
      if(!customerId){ markError('due-customer'); bad = true; }
      if(!amount || amount<=0){ markError('due-amount'); bad = true; }
      if(bad){ showToast(t('fillRequired')); return; }
      const items = dueRows.filter(r=>r.productId && r.qty>0).map(r=>{
        const p = data.products.find(p=>p.id===r.productId);
        return { productId:r.productId, productName:p?p.name:'', qty:r.qty, price:p?Number(p.sellingPrice):0 };
      });
      data.dues.push({id:uid(), customerId, amount, items, date:new Date().toISOString()});
      dueRows = [{productId:'',qty:''}];
      recalcCustomerDue(customerId);
      saveData(); render();
    };
    document.querySelectorAll('[data-deldue]').forEach(b=>{
      b.onclick = ()=>{
        const due = data.dues.find(d=>d.id===b.dataset.deldue);
        data.dues = data.dues.filter(d=>d.id!==b.dataset.deldue);
        if(due) recalcCustomerDue(due.customerId);
        saveData(); render();
      };
    });
    const pbtn = document.getElementById('payment-submit');
    if(pbtn) pbtn.onclick = ()=>{
      clearErrors(['pay-customer','pay-amount']);
      const customerId = val('pay-customer');
      const amount = numVal('pay-amount');
      let bad = false;
      if(!customerId){ markError('pay-customer'); bad = true; }
      if(!amount || amount<=0){ markError('pay-amount'); bad = true; }
      if(bad){ showToast(t('fillRequired')); return; }
      data.payments.push({id:uid(), customerId, amount, date:new Date().toISOString()});
      recalcCustomerDue(customerId);
      saveData(); render();
    };
  }
  if(tab==='expenses'){
    const btn = document.getElementById('expense-submit');
    if(btn) btn.onclick = ()=>{
      clearErrors(['exp-category','exp-amount']);
      const category = val('exp-category').trim();
      const amount = numVal('exp-amount');
      let bad = false;
      if(!category){ markError('exp-category'); bad = true; }
      if(!amount || amount<=0){ markError('exp-amount'); bad = true; }
      if(bad){ showToast(t('fillRequired')); return; }
      data.expenses.push({id:uid(), category, amount, notes:val('exp-notes'), date:new Date().toISOString()});
      saveData(); render();
    };
  }
  if(tab==='targets'){
    const wd = ()=> Math.max(numVal('target-workingdays')||26,1);
    const twoYearEl = document.getElementById('target-twoyear');
    const yearlyEl = document.getElementById('target-yearly');
    const monthlyEl = document.getElementById('target-monthly');
    const dailyEl = document.getElementById('target-daily');
    const wdEl = document.getElementById('target-workingdays');
    if(twoYearEl) twoYearEl.oninput = ()=>{
      const twoYear = numVal('target-twoyear');
      if(!twoYear) return;
      const yearly = twoYear/2, monthly = yearly/12;
      yearlyEl.value = Math.round(yearly);
      monthlyEl.value = Math.round(monthly);
      dailyEl.value = Math.round(monthly/wd());
    };
    if(yearlyEl) yearlyEl.oninput = ()=>{
      const yearly = numVal('target-yearly');
      if(!yearly) return;
      const monthly = yearly/12;
      monthlyEl.value = Math.round(monthly);
      dailyEl.value = Math.round(monthly/wd());
    };
    if(monthlyEl) monthlyEl.oninput = ()=>{
      const monthly = numVal('target-monthly');
      if(!monthly) return;
      dailyEl.value = Math.round(monthly/wd());
    };
    if(wdEl) wdEl.oninput = ()=>{
      const monthly = numVal('target-monthly');
      if(monthly) dailyEl.value = Math.round(monthly/wd());
    };
    const autoTwoYearBtn = document.getElementById('auto-twoyear');
    if(autoTwoYearBtn) autoTwoYearBtn.onclick = ()=> twoYearEl.oninput();
    const autoYearBtn = document.getElementById('auto-year');
    if(autoYearBtn) autoYearBtn.onclick = ()=> yearlyEl.oninput();
    const autoMonthBtn = document.getElementById('auto-month');
    if(autoMonthBtn) autoMonthBtn.onclick = ()=> monthlyEl.oninput();
    const btn = document.getElementById('targets-submit');
    if(btn) btn.onclick = ()=>{
      data.targets = {
        daily:numVal('target-daily'), monthly:numVal('target-monthly'), yearly:numVal('target-yearly'),
        twoYear:numVal('target-twoyear'), workingDays: Math.max(numVal('target-workingdays')||26,1)
      };
      saveData(); render();
    };
    const resetBtn = document.getElementById('reset-btn');
    if(resetBtn) resetBtn.onclick = ()=>{
      showConfirmModal(t('confirmReset'), ()=>{ data = JSON.parse(JSON.stringify(DEFAULT_DATA)); saveData(); render(); });
    };
  }
  if(tab==='reports'){
    document.querySelectorAll('[data-hgroup]').forEach(b=>{
      b.onclick = ()=>{ historyGroupBy = b.dataset.hgroup; render(); };
    });
    const histBtn = document.getElementById('hist-range-btn');
    if(histBtn) histBtn.onclick = ()=>{
      historyFrom = val('hist-from');
      historyTo = val('hist-to');
      const resultBox = document.getElementById('hist-range-result');
      if(!historyFrom || !historyTo){ showToast(t('fillRequired')); return; }
      const fromDate = new Date(historyFrom+'T00:00:00');
      const toDate = new Date(historyTo+'T23:59:59');
      const rangeSales = data.sales.filter(s=>{ const d=new Date(s.date); return d>=fromDate && d<=toDate; });
      const rev = sumRevenue(rangeSales), prof = sumProfit(rangeSales);
      if(resultBox) resultBox.innerHTML = `
        <table><tbody>
          <tr><td>${t('revenueTotal')}</td><td class="num tabular">${fmt(rev)}</td></tr>
          <tr><td>${t('profitTotal')}</td><td class="num tabular">${fmt(prof)}</td></tr>
          <tr><td>${t('salesCount')}</td><td class="num tabular">${rangeSales.length}</td></tr>
        </tbody></table>
      `;
    };
    const csvDay = document.getElementById('csv-day');
    if(csvDay) csvDay.onclick = ()=> exportCSV(filteredSales(isToday), 'sale-report-today.csv');
    const csvMonth = document.getElementById('csv-month');
    if(csvMonth) csvMonth.onclick = ()=> exportCSV(filteredSales(isThisMonth), 'sale-report-month.csv');
    const pdfDay = document.getElementById('pdf-day');
    if(pdfDay) pdfDay.onclick = ()=> exportPDF(filteredSales(isToday), 'Sales Report - Today', 'sale-report-today.pdf');
    const pdfMonth = document.getElementById('pdf-month');
    if(pdfMonth) pdfMonth.onclick = ()=> exportPDF(filteredSales(isThisMonth), 'Sales Report - This Month', 'sale-report-month.pdf');
  }
}

loadData();
</script>
</body>
</html>
